name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Release Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GOOGLE_TASKS_CLIENT_ID: ${{ secrets.GOOGLE_TASKS_CLIENT_ID }}
          GOOGLE_TASKS_CLIENT_SECRET: ${{ secrets.GOOGLE_TASKS_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Google Todo ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Publish updater manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "latest.json" | Select-Object -First 1
          if (-not $manifest) {
            throw "Could not find generated latest.json"
          }

          Copy-Item $manifest.FullName "$env:RUNNER_TEMP/latest.json" -Force

          git fetch origin main
          git checkout main
          Copy-Item "$env:RUNNER_TEMP/latest.json" "latest.json" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json

          if (git diff --cached --quiet) {
            Write-Host "latest.json is already up to date."
          } else {
            git commit -m "Update updater manifest for $env:GITHUB_REF_NAME"
            git push origin main
          }

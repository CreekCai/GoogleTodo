<body class="bg-surface-dark w-screen h-screen flex items-center justify-center font-body-md text-body-md antialiased overflow-hidden">
<!-- Background context (blurred out desktop app) -->
<div class="absolute inset-0 z-0">
<img alt="Background Dashboard" class="w-full h-full object-cover opacity-30 filter blur-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChikeeBs31TmLg8uj_2qAi8e1eGK88WVT3KQ667rJ5GTgOU8wg8V3KrCrGFpn-1szhn3ch4mGssvsdrJndaPH158x9gmMpBYnFsQw0zeB6JRiT_WTHDFm_TnFKoGS69A-ddRaZp_1KMVoqsXBr4lzCcl7ktuZf225OjZHqA_lDLE3kDLgkUBlhfn4hCm-W8NfF_aXukndzbGPfv-JACXgEDI349P7E4yRuHeOuw-IW4DvMlo62cHV4YEyUtFeKYyfothREmmYfiA"/>
<div class="absolute inset-0 bg-surface-dark/80 backdrop-blur-md"></div>
</div>
<!-- Modal Container -->
<div class="relative z-10 w-full max-w-2xl bg-surface-dark-elevated rounded-xl shadow-2xl border border-outline-variant/20 overflow-hidden flex flex-col mx-lg">
<!-- Header / Main Input Area -->
<div class="p-xl border-b border-outline-variant/10">
<input autofocus="" class="w-full bg-transparent border-none text-on-dark font-display-sm text-display-sm placeholder-muted focus:ring-0 p-0" placeholder="What needs to be done?" type="text"/>
</div>
<!-- Meta Data Area -->
<div class="px-xl py-lg flex flex-wrap items-center gap-md bg-surface-dark-elevated/50">
<!-- List Selector -->
<button class="flex items-center gap-xs px-sm py-xs rounded bg-surface-dark border border-outline-variant/20 text-on-dark-soft hover:text-on-dark hover:border-outline-variant/40 transition-colors">
<span class="material-symbols-outlined text-caption" style="font-size: 16px;">inbox</span>
<span class="font-body-sm text-body-sm">Inbox</span>
<span class="material-symbols-outlined text-caption ml-xs" style="font-size: 14px;">expand_more</span>
</button>
<!-- Due Date -->
<button class="flex items-center gap-xs px-sm py-xs rounded bg-surface-dark border border-outline-variant/20 text-on-dark-soft hover:text-on-dark hover:border-outline-variant/40 transition-colors">
<span class="material-symbols-outlined text-caption" style="font-size: 16px;">calendar_today</span>
<span class="font-body-sm text-body-sm">Today</span>
</button>
<!-- Time Estimate -->
<button class="flex items-center gap-xs px-sm py-xs rounded bg-surface-dark border border-outline-variant/20 text-on-dark-soft hover:text-on-dark hover:border-outline-variant/40 transition-colors">
<span class="material-symbols-outlined text-caption" style="font-size: 16px;">timer</span>
<span class="font-body-sm text-body-sm">30m</span>
</button>
<!-- Add Note -->
<button class="flex items-center gap-xs px-sm py-xs rounded bg-surface-dark border border-outline-variant/20 text-on-dark-soft hover:text-on-dark hover:border-outline-variant/40 transition-colors ml-auto">
<span class="material-symbols-outlined text-caption" style="font-size: 16px;">description</span>
<span class="font-body-sm text-body-sm hidden sm:inline">Add Note</span>
</button>
</div>
<!-- Note Input (Hidden by default, shown conceptually here) -->
<div class="px-xl py-sm bg-surface-dark border-t border-outline-variant/10">
<textarea class="w-full bg-transparent border-none text-on-dark-soft font-body-sm text-body-sm placeholder-muted focus:ring-0 p-0 resize-none h-16" placeholder="Add a description or context..."></textarea>
</div>
<!-- Footer / Actions -->
<div class="px-xl py-md flex items-center justify-between border-t border-outline-variant/10 bg-surface-dark-elevated">
<div class="flex items-center gap-sm text-muted">
<span class="font-body-sm text-body-sm">Press</span>
<kbd class="px-xs py-xxs bg-surface-dark border border-outline-variant/20 rounded text-caption font-code font-medium text-on-dark-soft">Esc</kbd>
<span class="font-body-sm text-body-sm">to cancel</span>
</div>
<div class="flex items-center gap-md">
<div class="flex items-center gap-sm text-muted mr-md hidden sm:flex">
<span class="font-body-sm text-body-sm">Press</span>
<kbd class="px-xs py-xxs bg-surface-dark border border-outline-variant/20 rounded text-caption font-code font-medium text-on-dark-soft">⌘</kbd>
<kbd class="px-xs py-xxs bg-surface-dark border border-outline-variant/20 rounded text-caption font-code font-medium text-on-dark-soft">Enter</kbd>
</div>
<button class="bg-primary text-on-dark font-button text-button px-lg py-sm rounded-lg hover:bg-primary-container transition-colors shadow-sm">
                    Create Task
                </button>
</div>
</div>
</div>
